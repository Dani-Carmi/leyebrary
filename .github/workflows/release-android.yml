name: Release Android APK

# Builds the keyless "public" EAS profile and attaches the APK to a GitHub release.
# Requires the EXPO_TOKEN repository secret (expo.dev → Account settings → Access tokens).

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag to build and attach the APK to (e.g. v1.0.0)"
        required: true

permissions:
  contents: write

concurrency:
  group: release-android-${{ github.event.release.tag_name || inputs.tag }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - run: npm ci

      - name: Build APK on EAS (profile "public", no API keys)
        shell: bash
        run: |
          eas build --platform android --profile public --non-interactive --wait --json > build.json
          url=$(jq -r '.[0].artifacts.buildUrl // .[0].artifacts.applicationArchiveUrl // empty' build.json)
          if [ -z "$url" ]; then
            echo "::error::No APK URL in EAS build output"
            cat build.json
            exit 1
          fi
          echo "APK_URL=$url" >> "$GITHUB_ENV"
          echo "APK_FILE=leyebrary-${TAG}.apk" >> "$GITHUB_ENV"

      - name: Download APK
        run: curl --fail --location --silent --show-error --output "$APK_FILE" "$APK_URL"

      - name: Check the APK contains no Google API key
        shell: bash
        run: |
          # grep -c reads the whole stream, so pipefail can't be tripped by SIGPIPE.
          count=$(unzip -p "$APK_FILE" | grep -ac "AIza" || true)
          if [ "$count" != "0" ]; then
            echo "::error::Found $count possible Google API key(s) in the APK; refusing to publish it"
            exit 1
          fi
          echo "No API keys found in $APK_FILE"

      - name: Attach APK to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$TAG" "$APK_FILE" --clobber
